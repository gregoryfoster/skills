repos:
  - repo: local
    hooks:
      - id: structural-tests
        name: Structural Tests
        # Not an inline `source .venv/bin/activate` (#156): a linked worktree
        # has no .venv, so that form rejected a finished commit with bash's
        # raw "No such file or directory" after a green suite. The script
        # links the main checkout's venv, or names the remedy.
        entry: bash scripts/structural-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Integration tests disabled on pre-push — LLM non-determinism makes this
      # too flaky as a hard gate. Run manually: scripts/run-integration-tests.sh
      # Uncomment to re-enable:
      # - id: integration-tests
      #   name: Integration Tests
      #   entry: scripts/run-integration-tests.sh
      #   language: system
      #   pass_filenames: false
      #   always_run: true
      #   stages: [pre-push]
