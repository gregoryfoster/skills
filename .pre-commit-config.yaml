repos:
  - repo: local
    hooks:
      # The context-budget fitness function (#88): AGENTS.md stays at or under
      # the budget in .skills/context-budget (6,000). The offline estimate
      # reading — no credential on the commit path — with the JSON discarded
      # because the GATE lines on stderr are the signal pre-commit shows.
      # First, so a budget breach fails in ~2s instead of after the ~3 min
      # suite. test_policy_surface_budget.py enforces the same ceiling inside
      # that suite; this hook is the named, surface-level spelling of it that
      # enforcing-architecture wires for cohort repos too.
      - id: context-budget-gate
        name: Context Budget Gate
        entry: bash -c 'bash skills/curating-context/scripts/measure-context.sh --gate >/dev/null'
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # The Python gate (#246): ruff check + ruff format --check over the tree,
      # configured in [tool.ruff] and pinned exactly in requirements-test.txt.
      # Ahead of the suite for the same reason the budget gate is — a format
      # breach fails in ~1s instead of after the ~4 min suite. The suite still
      # carries it (tests/structural/test_python_lint.py) so a run outside
      # pre-commit is gated too; this hook is the fast spelling, not a second
      # source of truth. The script delegates venv resolution to
      # structural-tests.sh --check rather than reimplementing #156's fix.
      - id: python-lint
        name: Python Lint (ruff)
        entry: bash scripts/python-lint.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      - id: structural-tests
        name: Structural Tests
        # Not an inline `source .venv/bin/activate` (#156): a linked worktree
        # has no .venv, so that form rejected a finished commit with bash's
        # raw "No such file or directory" after a green suite. The script
        # links the main checkout's venv, or names the remedy.
        entry: bash scripts/structural-tests.sh
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]

      # Integration tests disabled on pre-push — LLM non-determinism makes this
      # too flaky as a hard gate. Run manually: scripts/run-integration-tests.sh
      # Uncomment to re-enable:
      # - id: integration-tests
      #   name: Integration Tests
      #   entry: scripts/run-integration-tests.sh
      #   language: system
      #   pass_filenames: false
      #   always_run: true
      #   stages: [pre-push]
