# Proposes the action bumps nothing else does. Adopted with this repo's own
# adopting-dependabot skill (#376); guarded by tests/structural/test_dependabot.py,
# because a mistyped config stops producing PRs without erroring anywhere a
# person looks.
#
# Held back, each for its reason (the guard fails a block for any of them):
# - pip (requirements-test.txt): its floors already admit every release, so it
#   would propose only ruff, whose exact pin is the Python gate's and moves in
#   lockstep with AGENTS.md and a tree reformat. Security updates still cover
#   the file through the dependency graph, with no block here.
# - uv: uv.lock is an empty stub, and pyproject.toml has no [project].
# - pre-commit: every hook is `repo: local`, so there is nothing to move.
# Not Dependabot's at all: `runs-on: ubuntu-latest` moves on GitHub's schedule.
#
# Landing a PR: no workflow gates pull_request here, so a Dependabot PR has no
# CI and the ship gate is local. Per PR, one at a time:
#   git fetch origin "$(gh pr view <N> --json headRefName -q .headRefName)"
#   git merge --ff-only FETCH_HEAD    # main moved? comment `@dependabot rebase`
#                                     # and wait for headRefOid to change first
#   bash scripts/pre-ship.sh && git push origin main
# Both workflows run only on schedule/workflow_dispatch, so no PR exercised the
# bump: `gh workflow run <file>.yml` once after landing. context-cadence.yml is
# generated by install-cadence.sh, and a re-render writes its older pin back
# (#373): after any re-render, restore the bumped `uses:` line.
# Runbook: skills/adopting-dependabot/references/merge-paths.md.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/" # scans .github/workflows/ (and a root action.yml)
    schedule:
      interval: "weekly"
    # The default is 5, and past it no version update opens, and nothing says
    # so. One PR per action; the test derives the bound.
    open-pull-requests-limit: 10
    # The PR's commit lands on main as-is, so it takes the repo's form.
    commit-message:
      prefix: "chore"
